 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Luminary Studio AI — O Estúdio Definitivo para Escritores</title>
<meta name="description" content="Estúdio literário inteligente: cada obra é um universo isolado, com memória permanente e geração de capítulos guiada por IA." />
<meta name="theme-color" content="#050403" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LUMINARY STUDIO AI — DESIGN TOKENS
   A palette borrowed from illuminated manuscripts and old brass
   instruments, not from "dark mode SaaS #12". Every color here
   is desaturated on purpose — gold that has actually tarnished.
   ============================================================ */

:root {
  /* ---- Surface: never pure black, always a warm near-black ---- */
  --lum-black-absolute: #050403;
  --lum-black-charcoal: #0c0a08;
  --lum-graphite: #17140f;
  --lum-graphite-raised: #201b14;
  --lum-graphite-border: #2c2419;

  /* ---- Gold family: three distinct golds, used for different jobs ---- */
  --lum-gold-antique: #a3813f;   /* structural: rules, borders, icons at rest */
  --lum-gold-bright: #e8c168;    /* interactive: active state, focus, CTAs */
  --lum-bronze: #7a5a34;         /* recessed: disabled, secondary text on gold */
  --lum-gold-glow: rgba(232, 193, 104, 0.35);

  /* ---- Text ---- */
  --lum-cream: #efe6d4;          /* primary text — never pure white */
  --lum-cream-dim: #b9ac93;      /* secondary text */
  --lum-cream-faint: #7d735f;    /* tertiary / placeholder text */

  /* ---- Error: the only saturated color allowed in the system ---- */
  --lum-red-error: #b2453d;
  --lum-red-glow: rgba(178, 69, 61, 0.28);

  /* ---- Status accents (muted, never candy-colored) ---- */
  --lum-status-planning: #7d8f9e;
  --lum-status-writing: var(--lum-gold-bright);
  --lum-status-review: #a3813f;
  --lum-status-done: #7fa377;

  /* ---- Typography ---- */
  --lum-font-display: 'Cinzel Decorative', serif;   /* landing hero only */
  --lum-font-heading: 'Cinzel', serif;               /* section / obra titles */
  --lum-font-body: 'Crimson Pro', serif;              /* long-form reading text */
  --lum-font-ui: 'Inter', -apple-system, sans-serif;  /* interface chrome */

  /* ---- Spacing scale ---- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;
  --sp-9: 96px;

  /* ---- Layout ---- */
  --lum-header-h: 64px;
  --lum-sidebar-w: 260px;
  --lum-sidebar-w-collapsed: 72px;
  --lum-radius-sm: 3px;
  --lum-radius-md: 6px;
  --lum-border-hairline: 1px solid var(--lum-graphite-border);

  /* ---- Motion ---- */
  --lum-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --lum-duration-fast: 160ms;
  --lum-duration-med: 420ms;
  --lum-duration-slow: 900ms;

  /* ---- Elevation (gold-tinted shadows, not generic black) ---- */
  --lum-shadow-card: 0 4px 24px rgba(5, 4, 3, 0.5), 0 1px 0 rgba(163, 129, 63, 0.08) inset;
  --lum-shadow-raised: 0 12px 48px rgba(5, 4, 3, 0.65);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --lum-duration-fast: 0ms;
    --lum-duration-med: 0ms;
    --lum-duration-slow: 0ms;
  }
}
/* ============================================================
   BASE — reset + global typography
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--lum-black-absolute);
  color: var(--lum-cream);
  font-family: var(--lum-font-ui);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body { min-height: 100vh; }

h1, h2, h3, h4 { margin: 0; font-family: var(--lum-font-heading); font-weight: 600; letter-spacing: 0.02em; }
p { margin: 0; }

a { color: var(--lum-gold-bright); text-decoration: none; }

button, input, select, textarea {
  font-family: var(--lum-font-ui);
  color: var(--lum-cream);
  background: transparent;
  border: none;
  outline: none;
}
button { cursor: pointer; }

::selection { background: var(--lum-gold-glow); color: var(--lum-cream); }

/* Visible keyboard focus everywhere — never remove this */
:focus-visible {
  outline: 2px solid var(--lum-gold-bright);
  outline-offset: 2px;
  border-radius: var(--lum-radius-sm);
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--lum-black-charcoal); }
::-webkit-scrollbar-thumb { background: var(--lum-graphite-border); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--lum-gold-antique); }

/* ---- Ornament utilities: the "illuminated manuscript" motif ---- */

.lum-hairline {
  border: none;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--lum-gold-antique) 20%, var(--lum-gold-antique) 80%, transparent);
  opacity: 0.5;
  margin: var(--sp-5) 0;
}

/* Corner flourish: a small drawn bracket used on cards instead of a generic border-radius box */
.lum-corners { position: relative; }
.lum-corners::before,
.lum-corners::after {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  border: 1px solid var(--lum-gold-antique);
  opacity: 0.55;
  pointer-events: none;
  transition: opacity var(--lum-duration-fast) var(--lum-ease);
}
.lum-corners::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.lum-corners::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
.lum-corners:hover::before, .lum-corners:hover::after { opacity: 1; }

.lum-eyebrow {
  font-family: var(--lum-font-ui);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--lum-gold-antique);
}

.lum-visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; margin: -1px;
}

.lum-scrollable { scrollbar-gutter: stable; }
/* ============================================================
   AGE GATE — shown before everything else
   ============================================================ */

#lum-age-gate {
  display: none;
}
#lum-age-gate.lum-agegate--active {
  display: flex;
  position: fixed;
  inset: 0;
  z-index: 500;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, var(--lum-graphite) 0%, var(--lum-black-absolute) 70%);
  padding: var(--sp-5);
}

.lum-agegate__content {
  max-width: 480px;
  text-align: center;
}

.lum-agegate__badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  border: 1px solid var(--lum-gold-antique);
  border-radius: 50%;
  font-family: var(--lum-font-heading);
  font-size: 15px;
  font-weight: 700;
  color: var(--lum-gold-bright);
  margin: 0 auto var(--sp-5);
  box-shadow: 0 0 24px var(--lum-gold-glow);
}

.lum-agegate__eyebrow { display: block; margin-bottom: var(--sp-3); }

.lum-agegate__title {
  font-family: var(--lum-font-heading);
  font-size: clamp(1.5rem, 5vw, 2rem);
  line-height: 1.25;
  color: var(--lum-cream);
  margin-bottom: var(--sp-4);
}
.lum-agegate__title em { font-style: normal; color: var(--lum-gold-bright); }

.lum-agegate__text {
  font-family: var(--lum-font-body);
  font-size: 14.5px;
  line-height: 1.7;
  color: var(--lum-cream-dim);
  margin-bottom: var(--sp-6);
}

.lum-agegate__actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-4);
}

.lum-agegate__decline {
  font-family: var(--lum-font-ui);
  font-size: 12.5px;
  color: var(--lum-cream-faint);
  text-decoration: underline;
  text-underline-offset: 3px;
  padding: var(--sp-2);
}
.lum-agegate__decline:hover { color: var(--lum-cream-dim); }

@media (max-width: 480px) {
  .lum-agegate__actions .lum-btn-enter { width: 100%; }
}
/* ============================================================
   LANDING — the threshold, not the product.
   Signature move: the title condenses out of drifting gold
   particles instead of just fading in.
   ============================================================ */

#lum-landing {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, var(--lum-graphite) 0%, var(--lum-black-absolute) 70%);
  transition: opacity var(--lum-duration-slow) var(--lum-ease), visibility var(--lum-duration-slow) var(--lum-ease);
}

#lum-landing.lum-landing--leaving {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#lum-particles-landing {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.lum-landing__content {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 640px;
  padding: 0 var(--sp-5);
  opacity: 0;
  transform: translateY(14px);
  animation: lum-rise 1.4s var(--lum-ease) 0.3s forwards;
}

@keyframes lum-rise {
  to { opacity: 1; transform: translateY(0); }
}

.lum-landing__mark {
  width: 46px;
  height: 46px;
  margin: 0 auto var(--sp-5);
  opacity: 0.85;
}

.lum-landing__eyebrow {
  display: block;
  margin-bottom: var(--sp-4);
}

.lum-landing__title {
  font-family: var(--lum-font-display);
  font-size: clamp(2.4rem, 7vw, 4.4rem);
  line-height: 1.08;
  color: var(--lum-cream);
  text-shadow: 0 0 40px var(--lum-gold-glow);
  margin: 0 0 var(--sp-4);
}

.lum-landing__title em {
  font-style: normal;
  color: var(--lum-gold-bright);
}

.lum-landing__subtitle {
  font-family: var(--lum-font-body);
  font-style: italic;
  font-size: clamp(1rem, 2.4vw, 1.25rem);
  color: var(--lum-cream-dim);
  max-width: 460px;
  margin: 0 auto var(--sp-7);
  line-height: 1.6;
}

.lum-landing__rule {
  width: 120px;
  margin: var(--sp-6) auto;
}

.lum-btn-enter {
  position: relative;
  font-family: var(--lum-font-ui);
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--lum-black-absolute);
  background: linear-gradient(180deg, var(--lum-gold-bright), var(--lum-gold-antique));
  padding: var(--sp-4) var(--sp-7);
  border-radius: var(--lum-radius-sm);
  font-weight: 600;
  transition: transform var(--lum-duration-fast) var(--lum-ease), box-shadow var(--lum-duration-fast) var(--lum-ease);
  box-shadow: 0 0 0 rgba(232, 193, 104, 0);
}

.lum-btn-enter:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px var(--lum-gold-glow);
}

.lum-btn-enter:active { transform: translateY(0); }

.lum-landing__hint {
  display: block;
  margin-top: var(--sp-5);
  font-size: 12px;
  color: var(--lum-cream-faint);
  font-family: var(--lum-font-ui);
}

@media (max-width: 520px) {
  .lum-btn-enter { width: 100%; padding: var(--sp-4); }
}
/* ============================================================
   LAYOUT — header, sidebar, main shell
   ============================================================ */

#lum-app {
  position: relative;
  min-height: 100vh;
  opacity: 0;
  transition: opacity var(--lum-duration-slow) var(--lum-ease);
}
#lum-app.lum-app--visible { opacity: 1; }

#lum-particles-ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
}

/* ---------------- HEADER ---------------- */

#lum-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--lum-header-h);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: 0 var(--sp-5);
  background: rgba(12, 10, 8, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: var(--lum-border-hairline);
}

.lum-header__brand {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-shrink: 0;
}
.lum-header__brand svg { width: 22px; height: 22px; color: var(--lum-gold-bright); flex-shrink: 0; }
.lum-header__brand span {
  font-family: var(--lum-font-heading);
  font-size: 15px;
  letter-spacing: 0.06em;
  color: var(--lum-cream);
  white-space: nowrap;
}

.lum-header__menu-toggle {
  display: none;
  padding: var(--sp-2);
  color: var(--lum-cream-dim);
}

.lum-header__search {
  flex: 1;
  max-width: 420px;
  position: relative;
}
.lum-header__search input {
  width: 100%;
  padding: var(--sp-3) var(--sp-4) var(--sp-3) 38px;
  background: var(--lum-graphite);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  font-size: 13px;
  color: var(--lum-cream);
  transition: border-color var(--lum-duration-fast) var(--lum-ease);
}
.lum-header__search input::placeholder { color: var(--lum-cream-faint); }
.lum-header__search input:focus { border-color: var(--lum-gold-antique); }
.lum-header__search svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--lum-cream-faint); pointer-events: none;
}
.lum-header__search-results {
  position: absolute;
  top: calc(100% + 8px);
  left: 0; right: 0;
  background: var(--lum-graphite-raised);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  box-shadow: var(--lum-shadow-raised);
  max-height: 320px;
  overflow-y: auto;
  display: none;
}
.lum-header__search-results.lum-open { display: block; }
.lum-header__search-result {
  padding: var(--sp-3) var(--sp-4);
  font-size: 13px;
  border-bottom: 1px solid var(--lum-graphite-border);
  cursor: pointer;
}
.lum-header__search-result:last-child { border-bottom: none; }
.lum-header__search-result:hover { background: rgba(232, 193, 104, 0.06); }
.lum-header__search-result small { display: block; color: var(--lum-cream-faint); margin-top: 2px; }

.lum-header__spacer { flex: 1; }

.lum-header__actions {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-shrink: 0;
}

.lum-select {
  padding: var(--sp-2) var(--sp-3);
  background: var(--lum-graphite);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-sm);
  font-size: 12px;
  color: var(--lum-cream-dim);
  appearance: none;
  cursor: pointer;
}

.lum-key-input {
  padding: var(--sp-2) var(--sp-3);
  background: var(--lum-graphite);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-sm);
  font-size: 13px;
  color: var(--lum-cream);
  width: 100%;
}
.lum-key-input:focus { border-color: var(--lum-gold-antique); }

/* AI quick-access popover: one trigger button, one panel, same on every
   screen size. Replaces an earlier version that kept a separate inline
   desktop row PLUS a separate mobile popover in sync — a single popover
   is simpler and has one less place for the two layouts to drift apart. */
.lum-header__ai-cluster {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: var(--sp-3);
  flex-direction: column;
  align-items: stretch;
  gap: var(--sp-3);
  background: var(--lum-graphite-raised);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  box-shadow: var(--lum-shadow-raised);
  padding: var(--sp-4);
  min-width: 240px;
  z-index: 250;
}
.lum-header__ai-cluster.lum-open { display: flex; }

.lum-ai-tabs {
  display: flex;
  gap: 6px;
}
.lum-ai-tab {
  flex: 1;
  padding: 8px 6px;
  border-radius: var(--lum-radius-sm);
  border: 1px solid var(--lum-graphite-border);
  background: transparent;
  color: var(--lum-cream-dim);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  transition: all var(--lum-duration-fast) var(--lum-ease);
}
.lum-ai-tab:hover { border-color: var(--lum-gold-antique); }
.lum-ai-tab--active {
  background: var(--lum-gold-bright);
  border-color: var(--lum-gold-bright);
  color: var(--lum-black-absolute);
}
.lum-ai-tab--configured:not(.lum-ai-tab--active)::after {
  content: '';
  position: absolute;
  top: 4px; right: 4px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--lum-status-done);
}

#lum-ai-quick-save {
  background: linear-gradient(180deg, var(--lum-gold-bright), var(--lum-gold-antique));
  color: var(--lum-black-absolute);
}

#lum-btn-gerenciar-ia {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: var(--sp-2);
  color: var(--lum-cream-faint);
}
#lum-btn-gerenciar-ia:hover { color: var(--lum-gold-bright); }

.lum-header__ai-toggle { display: flex; position: relative; }

.lum-icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  border-radius: var(--lum-radius-sm);
  color: var(--lum-cream-dim);
  transition: background var(--lum-duration-fast) var(--lum-ease), color var(--lum-duration-fast) var(--lum-ease);
  position: relative;
}
.lum-icon-btn:hover { background: rgba(232, 193, 104, 0.08); color: var(--lum-gold-bright); }
.lum-icon-btn svg { width: 18px; height: 18px; }

.lum-key-status {
  position: absolute;
  bottom: 5px; right: 5px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--lum-cream-faint);
  border: 1px solid var(--lum-black-charcoal);
}
.lum-key-status.lum-key-status--ok { background: var(--lum-status-done); }
.lum-key-status.lum-key-status--missing { background: var(--lum-red-error); }

/* ---------------- SIDEBAR ---------------- */

#lum-sidebar {
  position: fixed;
  top: var(--lum-header-h);
  left: 0;
  bottom: 0;
  width: var(--lum-sidebar-w);
  background: var(--lum-black-charcoal);
  border-right: var(--lum-border-hairline);
  z-index: 90;
  display: flex;
  flex-direction: column;
  transition: width var(--lum-duration-med) var(--lum-ease), transform var(--lum-duration-med) var(--lum-ease);
  overflow-y: auto;
  overflow-x: hidden;
}

#lum-sidebar.lum-sidebar--collapsed { width: var(--lum-sidebar-w-collapsed); }

.lum-sidebar__collapse-toggle {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: var(--sp-3) var(--sp-4);
  flex-shrink: 0;
}
.lum-sidebar__collapse-toggle button { color: var(--lum-cream-faint); padding: var(--sp-2); }
.lum-sidebar__collapse-toggle button:hover { color: var(--lum-gold-bright); }

.lum-nav {
  list-style: none;
  margin: 0;
  padding: var(--sp-2) var(--sp-3);
  flex: 1;
}

.lum-nav__section-label {
  font-family: var(--lum-font-ui);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--lum-cream-faint);
  padding: var(--sp-4) var(--sp-3) var(--sp-2);
  white-space: nowrap;
  overflow: hidden;
}
#lum-sidebar.lum-sidebar--collapsed .lum-nav__section-label { opacity: 0; height: 0; padding: 0; }

.lum-nav__item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  border-radius: var(--lum-radius-sm);
  color: var(--lum-cream-dim);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  margin-bottom: 2px;
  transition: background var(--lum-duration-fast) var(--lum-ease), color var(--lum-duration-fast) var(--lum-ease);
  position: relative;
}
.lum-nav__item:hover { background: rgba(232, 193, 104, 0.06); color: var(--lum-cream); }
.lum-nav__item.lum-nav__item--active { background: rgba(232, 193, 104, 0.1); color: var(--lum-gold-bright); }
.lum-nav__item.lum-nav__item--active::before {
  content: '';
  position: absolute; left: -12px; top: 8px; bottom: 8px; width: 2px;
  background: var(--lum-gold-bright);
}
.lum-nav__item svg { width: 17px; height: 17px; flex-shrink: 0; }
.lum-nav__item span { overflow: hidden; text-overflow: ellipsis; }
#lum-sidebar.lum-sidebar--collapsed .lum-nav__item span { display: none; }
#lum-sidebar.lum-sidebar--collapsed .lum-nav__item { justify-content: center; }

.lum-sidebar__footer {
  padding: var(--sp-4);
  border-top: var(--lum-border-hairline);
  flex-shrink: 0;
}
.lum-sidebar__obra-atual {
  font-size: 11px;
  color: var(--lum-cream-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lum-sidebar__obra-atual strong { display: block; color: var(--lum-gold-antique); font-family: var(--lum-font-heading); font-size: 13px; margin-bottom: 2px; }
#lum-sidebar.lum-sidebar--collapsed .lum-sidebar__footer { display: none; }

#lum-sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(5, 4, 3, 0.7);
  z-index: 80;
}
#lum-sidebar-overlay.lum-open { display: block; }

/* ---------------- MAIN ---------------- */

#lum-main {
  margin-left: var(--lum-sidebar-w);
  margin-top: var(--lum-header-h);
  padding: var(--sp-6);
  min-height: calc(100vh - var(--lum-header-h));
  position: relative;
  z-index: 1;
  transition: margin-left var(--lum-duration-med) var(--lum-ease);
}
#lum-app.lum-sidebar-collapsed #lum-main { margin-left: var(--lum-sidebar-w-collapsed); }

.lum-view {
  max-width: 1240px;
  margin: 0 auto;
  animation: lum-view-in 0.5s var(--lum-ease);
}
@keyframes lum-view-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.lum-view__header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
  flex-wrap: wrap;
}
.lum-view__title {
  font-family: var(--lum-font-heading);
  font-size: 26px;
  color: var(--lum-cream);
}
.lum-view__subtitle {
  font-family: var(--lum-font-body);
  font-style: italic;
  color: var(--lum-cream-dim);
  font-size: 14px;
  margin-top: var(--sp-2);
}

/* ---------------- RESPONSIVE ---------------- */

@media (max-width: 960px) {
  .lum-header__search { max-width: none; }
  #lum-sidebar {
    transform: translateX(-100%);
    width: 280px;
  }
  #lum-sidebar.lum-sidebar--drawer-open { transform: translateX(0); }
  #lum-sidebar.lum-sidebar--collapsed { width: 280px; }
  #lum-main { margin-left: 0; padding: var(--sp-4); }
  #lum-app.lum-sidebar-collapsed #lum-main { margin-left: 0; }
  .lum-header__menu-toggle { display: flex; }
  .lum-sidebar__collapse-toggle { display: none; }
}

@media (max-width: 600px) {
  #lum-header { padding: 0 var(--sp-3); gap: var(--sp-2); }
  .lum-header__brand span { display: none; }
  .lum-view__title { font-size: 21px; }
}

/* ============================================================
   COMPONENTS
   ============================================================ */

/* ---- Buttons ---- */

.lum-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-5);
  border-radius: var(--lum-radius-sm);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: transform var(--lum-duration-fast) var(--lum-ease), box-shadow var(--lum-duration-fast) var(--lum-ease), background var(--lum-duration-fast) var(--lum-ease);
  white-space: nowrap;
}
.lum-btn--primary {
  color: var(--lum-black-absolute);
  background: linear-gradient(180deg, var(--lum-gold-bright), var(--lum-gold-antique));
}
.lum-btn--primary:hover { box-shadow: 0 6px 20px var(--lum-gold-glow); transform: translateY(-1px); }
.lum-btn--ghost {
  color: var(--lum-cream-dim);
  border: var(--lum-border-hairline);
  background: transparent;
}
.lum-btn--ghost:hover { border-color: var(--lum-gold-antique); color: var(--lum-gold-bright); }
.lum-btn--danger { color: var(--lum-red-error); border: 1px solid rgba(178, 69, 61, 0.4); }
.lum-btn--danger:hover { background: var(--lum-red-glow); }
.lum-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.lum-btn svg { width: 15px; height: 15px; }

/* ---- Cards ---- */

.lum-card {
  background: var(--lum-graphite);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  padding: var(--sp-5);
  box-shadow: var(--lum-shadow-card);
}

.lum-stat-card {
  padding: var(--sp-4);
}
.lum-stat-card__label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--lum-cream-faint);
  margin-bottom: var(--sp-2);
}
.lum-stat-card__value {
  font-family: var(--lum-font-heading);
  font-size: 26px;
  color: var(--lum-gold-bright);
}
.lum-stat-card__hint { font-size: 12px; color: var(--lum-cream-faint); margin-top: var(--sp-1); }

.lum-stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}

.lum-panel-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: var(--sp-5);
}
@media (max-width: 900px) { .lum-panel-grid { grid-template-columns: 1fr; } }

/* ---- Empty state ---- */

.lum-empty {
  text-align: center;
  padding: var(--sp-9) var(--sp-5);
  color: var(--lum-cream-faint);
}
.lum-empty svg { width: 40px; height: 40px; color: var(--lum-gold-antique); opacity: 0.6; margin-bottom: var(--sp-4); }
.lum-empty h3 { font-family: var(--lum-font-heading); color: var(--lum-cream-dim); font-size: 18px; margin-bottom: var(--sp-2); }
.lum-empty p { font-size: 13px; max-width: 340px; margin: 0 auto var(--sp-5); line-height: 1.6; }

/* ---- Forms ---- */

.lum-field { margin-bottom: var(--sp-4); }
.lum-field label {
  display: block;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--lum-cream-dim);
  margin-bottom: var(--sp-2);
}
.lum-field .lum-field__hint { font-size: 11px; color: var(--lum-cream-faint); margin-top: var(--sp-1); }
.lum-field input[type="text"],
.lum-field input[type="number"],
.lum-field input[type="password"],
.lum-field select,
.lum-field textarea {
  width: 100%;
  padding: var(--sp-3) var(--sp-4);
  background: var(--lum-black-charcoal);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-sm);
  font-size: 13.5px;
  color: var(--lum-cream);
  transition: border-color var(--lum-duration-fast) var(--lum-ease);
}
.lum-field textarea { resize: vertical; min-height: 90px; font-family: var(--lum-font-body); font-size: 14.5px; line-height: 1.6; }
.lum-field input:focus, .lum-field select:focus, .lum-field textarea:focus { border-color: var(--lum-gold-antique); }
.lum-field input::placeholder, .lum-field textarea::placeholder { color: var(--lum-cream-faint); }
.lum-field select { appearance: none; cursor: pointer; }

.lum-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
@media (max-width: 560px) { .lum-field-row { grid-template-columns: 1fr; } }

.lum-field-error { color: var(--lum-red-error); font-size: 11px; margin-top: var(--sp-1); display: none; }
.lum-field--invalid input, .lum-field--invalid textarea, .lum-field--invalid select { border-color: var(--lum-red-error); }
.lum-field--invalid .lum-field-error { display: block; }

/* ---- Modal ---- */

.lum-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(5, 4, 3, 0.78);
  backdrop-filter: blur(3px);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-5);
  opacity: 0;
  transition: opacity var(--lum-duration-fast) var(--lum-ease);
}
.lum-modal-overlay.lum-open { opacity: 1; }

.lum-modal {
  background: var(--lum-graphite-raised);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  box-shadow: var(--lum-shadow-raised);
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  transform: translateY(12px) scale(0.98);
  transition: transform var(--lum-duration-med) var(--lum-ease);
}
.lum-modal-overlay.lum-open .lum-modal { transform: translateY(0) scale(1); }
.lum-modal--wide { max-width: 780px; }

.lum-modal__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-5);
  border-bottom: var(--lum-border-hairline);
  flex-shrink: 0;
}
.lum-modal__title { font-family: var(--lum-font-heading); font-size: 18px; color: var(--lum-cream); }
.lum-modal__body { padding: var(--sp-5); overflow-y: auto; }
.lum-modal__footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-3);
  padding: var(--sp-5);
  border-top: var(--lum-border-hairline);
  flex-shrink: 0;
}

/* ---- Wizard (Nova Obra) ---- */

.lum-wizard__steps {
  display: flex;
  gap: var(--sp-2);
  margin-bottom: var(--sp-5);
  padding: 0 var(--sp-5);
}
.lum-wizard__step-dot {
  flex: 1;
  height: 2px;
  background: var(--lum-graphite-border);
  border-radius: 2px;
  transition: background var(--lum-duration-fast) var(--lum-ease);
}
.lum-wizard__step-dot.lum-active { background: var(--lum-gold-bright); }
.lum-wizard__step-dot.lum-done { background: var(--lum-gold-antique); }
.lum-wizard__step-label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--lum-gold-antique);
  padding: 0 var(--sp-5);
  margin-bottom: var(--sp-4);
}

/* ---- Gaveta (book shelf grid) ---- */

.lum-shelf-toolbar {
  display: flex;
  gap: var(--sp-3);
  align-items: center;
  margin-bottom: var(--sp-5);
  flex-wrap: wrap;
}
.lum-shelf-toolbar .lum-field { margin: 0; flex: 1; min-width: 180px; }

.lum-shelf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: var(--sp-5);
}

.lum-book {
  cursor: pointer;
  transition: transform var(--lum-duration-fast) var(--lum-ease);
}
.lum-book:hover { transform: translateY(-4px); }

.lum-book__cover {
  aspect-ratio: 2 / 3;
  border-radius: var(--lum-radius-sm) var(--lum-radius-sm) 2px 2px;
  background: linear-gradient(155deg, var(--lum-graphite-raised), var(--lum-black-charcoal));
  border: 1px solid var(--lum-graphite-border);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: var(--sp-4);
  position: relative;
  overflow: hidden;
  box-shadow: var(--lum-shadow-card);
}
.lum-book__cover::before {
  content: '';
  position: absolute; left: 12px; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(var(--lum-gold-antique), transparent 70%);
  opacity: 0.4;
}
.lum-book__cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.lum-book__genre { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lum-gold-antique); position: relative; z-index: 1; }
.lum-book__title {
  font-family: var(--lum-font-heading);
  font-size: 15px;
  line-height: 1.25;
  color: var(--lum-cream);
  margin: var(--sp-1) 0;
  position: relative; z-index: 1;
}
.lum-book__author { font-size: 11px; color: var(--lum-cream-dim); position: relative; z-index: 1; }

.lum-book__fav {
  position: absolute; top: var(--sp-3); right: var(--sp-3);
  z-index: 2;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  color: var(--lum-cream-faint);
  background: rgba(5,4,3,0.5);
  border-radius: 50%;
}
.lum-book__fav.lum-active, .lum-book__fav:hover { color: var(--lum-gold-bright); }
.lum-book__fav svg { width: 13px; height: 13px; }

.lum-book__meta {
  padding-top: var(--sp-2);
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--lum-cream-faint);
}

.lum-progress {
  height: 3px;
  background: var(--lum-graphite-border);
  border-radius: 2px;
  overflow: hidden;
  margin-top: var(--sp-2);
}
.lum-progress__fill { height: 100%; background: linear-gradient(90deg, var(--lum-gold-antique), var(--lum-gold-bright)); }

.lum-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  letter-spacing: 0.04em;
  padding: 3px 8px;
  border-radius: 3px;
  background: rgba(232, 193, 104, 0.1);
  color: var(--lum-gold-bright);
}
.lum-badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.lum-badge--planning { color: var(--lum-status-planning); background: rgba(125, 143, 158, 0.12); }
.lum-badge--review { color: var(--lum-status-review); background: rgba(163, 129, 63, 0.14); }
.lum-badge--done { color: var(--lum-status-done); background: rgba(127, 163, 119, 0.12); }

/* ---- Dropdown menu (context menu on book / user menu) ---- */

.lum-menu {
  position: absolute;
  background: var(--lum-graphite-raised);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  box-shadow: var(--lum-shadow-raised);
  min-width: 180px;
  z-index: 250;
  padding: var(--sp-2);
  display: none;
}
.lum-menu.lum-open { display: block; }
.lum-menu__item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  font-size: 13px;
  color: var(--lum-cream-dim);
  border-radius: var(--lum-radius-sm);
  cursor: pointer;
}
.lum-menu__item:hover { background: rgba(232, 193, 104, 0.08); color: var(--lum-gold-bright); }
.lum-menu__item svg { width: 14px; height: 14px; }
.lum-menu__item--danger { color: var(--lum-red-error); }
.lum-menu__item--danger:hover { background: var(--lum-red-glow); color: var(--lum-red-error); }
.lum-menu__divider { height: 1px; background: var(--lum-graphite-border); margin: var(--sp-2) 0; }

/* ---- Placeholder view (modules not yet built) ---- */

.lum-soon {
  text-align: center;
  padding: var(--sp-9) var(--sp-5);
}
.lum-soon .lum-eyebrow { display: block; margin-bottom: var(--sp-3); }
.lum-soon h2 { font-family: var(--lum-font-heading); font-size: 24px; color: var(--lum-cream); margin-bottom: var(--sp-3); }
.lum-soon p { color: var(--lum-cream-dim); max-width: 420px; margin: 0 auto; line-height: 1.7; font-family: var(--lum-font-body); font-size: 15px; }

/* ---- Toast ---- */

#lum-toast-stack {
  position: fixed;
  bottom: var(--sp-5);
  right: var(--sp-5);
  z-index: 400;
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.lum-toast {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  background: var(--lum-graphite-raised);
  border: var(--lum-border-hairline);
  border-left: 2px solid var(--lum-gold-bright);
  border-radius: var(--lum-radius-sm);
  padding: var(--sp-3) var(--sp-4);
  box-shadow: var(--lum-shadow-raised);
  font-size: 13px;
  min-width: 220px;
  max-width: 320px;
  animation: lum-toast-in 0.3s var(--lum-ease);
}
.lum-toast--error { border-left-color: var(--lum-red-error); }
@keyframes lum-toast-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }

@media (max-width: 600px) {
  #lum-toast-stack { left: var(--sp-3); right: var(--sp-3); bottom: var(--sp-3); }
  .lum-toast { max-width: none; }
}
/* ============================================================
   ANIMATIONS — the "forja literária" loading experience
   ============================================================ */

.lum-forge {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: var(--sp-8) var(--sp-5);
}

.lum-forge__canvas-wrap {
  width: 100%;
  max-width: 280px;
  height: 180px;
  margin-bottom: var(--sp-5);
  border-radius: var(--lum-radius-md);
  overflow: hidden;
  background: var(--lum-black-absolute);
  box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
}

.lum-forge__message {
  font-family: var(--lum-font-heading);
  font-size: 15px;
  color: var(--lum-cream);
  min-height: 22px;
  transition: opacity var(--lum-duration-fast) var(--lum-ease);
}
.lum-forge__message.lum-fade { opacity: 0; }

.lum-forge__bar {
  width: 220px;
  height: 2px;
  background: var(--lum-graphite-border);
  border-radius: 2px;
  margin-top: var(--sp-5);
  overflow: hidden;
}
.lum-forge__bar-fill {
  height: 100%;
  width: 30%;
  background: linear-gradient(90deg, transparent, var(--lum-gold-bright), transparent);
  animation: lum-forge-sweep 1.6s ease-in-out infinite;
}
@keyframes lum-forge-sweep {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(400%); }
}

canvas.lum-particle-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* Simple fade-in used across dynamically injected views */
.lum-fade-in { animation: lum-fade-in 0.4s var(--lum-ease); }
@keyframes lum-fade-in { from { opacity: 0; } to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .lum-forge__bar-fill { animation: none; width: 100%; }
}
/* ============================================================
   CAPÍTULOS — list + editor
   ============================================================ */

/* ---- Chapter list ---- */

.lum-chapter-row {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-4);
  border-bottom: 1px solid var(--lum-graphite-border);
  cursor: pointer;
  transition: background var(--lum-duration-fast) var(--lum-ease);
}
.lum-chapter-row:hover { background: rgba(232, 193, 104, 0.05); }
.lum-chapter-row:last-child { border-bottom: none; }

.lum-chapter-row__num {
  font-family: var(--lum-font-heading);
  font-size: 22px;
  color: var(--lum-gold-antique);
  width: 44px;
  text-align: center;
  flex-shrink: 0;
}
.lum-chapter-row__body { flex: 1; min-width: 0; }
.lum-chapter-row__title { font-family: var(--lum-font-heading); font-size: 15px; color: var(--lum-cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lum-chapter-row__meta { font-size: 12px; color: var(--lum-cream-faint); margin-top: 2px; }
.lum-chapter-row__status {
  flex-shrink: 0;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 3px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.lum-chapter-row__status--rascunho { background: rgba(125, 143, 158, 0.12); color: var(--lum-status-planning); }
.lum-chapter-row__status--gerado { background: rgba(127, 163, 119, 0.12); color: var(--lum-status-done); }

/* ---- Chip input (eventos obrigatórios/proibidos, personagens presentes) ---- */

.lum-chip-input {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: var(--sp-3);
  background: var(--lum-black-charcoal);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-sm);
  min-height: 46px;
}
.lum-chip-input:focus-within { border-color: var(--lum-gold-antique); }
.lum-chip-input input {
  flex: 1;
  min-width: 120px;
  background: none;
  border: none;
  padding: 4px;
  font-size: 13px;
  color: var(--lum-cream);
}
.lum-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px 4px 10px;
  background: rgba(232, 193, 104, 0.1);
  color: var(--lum-gold-bright);
  border-radius: 4px;
  font-size: 12.5px;
  white-space: nowrap;
}
.lum-chip button { display: flex; color: inherit; opacity: 0.7; padding: 2px; }
.lum-chip button:hover { opacity: 1; }
.lum-chip--proibido { background: rgba(178, 69, 61, 0.14); color: #d98b83; }

/* ---- Multiselect chips (focos, ênfases, tom emocional) ---- */

.lum-multiselect {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.lum-multiselect-chip {
  padding: 7px 13px;
  border-radius: 20px;
  border: 1px solid var(--lum-graphite-border);
  font-size: 12.5px;
  color: var(--lum-cream-dim);
  cursor: pointer;

__define('components/ageGate', function(__require, exports) {
/* ============================================================
   components/ageGate.js
   ------------------------------------------------------------
   Shown before the landing screen and before anything else in
   the app mounts. This is a standard self-declaration age gate
   (the same pattern used across the industry) — a click-through
   confirmation, not real identity/age verification. It gives
   the standard "the person declared it themselves" cover, but
   does not and cannot guarantee a minor won't click through
   anyway.

   Persisted in the IndexedDB 'config' store (not literal
   localStorage) to stay consistent with the rest of the app's
   storage architecture — confirmation carries across visits in
   the same browser, isolated per-browser like everything else.
   ============================================================ */

const { db } = __require('core/db');
const CONFIG_KEY = 'ageConfirmed';

async function isAgeConfirmed() {
  const rec = await db.get('config', CONFIG_KEY);
  return rec?.value === true;
}

function mountAgeGate({ onConfirmed }) {
  const el = document.getElementById('lum-age-gate');
  el.classList.add('lum-agegate--active');
  el.innerHTML = `
    <div class="lum-agegate__content">
      <div class="lum-agegate__badge">18+</div>
      <span class="lum-eyebrow lum-agegate__eyebrow">Aviso de conteúdo</span>
      <h1 class="lum-agegate__title">Este espaço é para <em>maiores de 18 anos</em></h1>
      <p class="lum-agegate__text">
        As obras criadas e lidas aqui podem conter temas adultos: violência,
        conteúdo sombrio, romance e cenas de tensão explícita. Ao continuar,
        você declara ter 18 anos ou mais.
      </p>
      <div class="lum-agegate__actions">
        <button class="lum-btn-enter" id="lum-agegate-confirm">Tenho 18 anos ou mais — Entrar</button>
        <button class="lum-agegate__decline" id="lum-agegate-decline">Não tenho 18 anos</button>
      </div>
    </div>
  `;

  document.getElementById('lum-agegate-confirm').addEventListener('click', async () => {
    await db.put('config', { key: CONFIG_KEY, value: true });
    el.remove();
    onConfirmed();
  });

  document.getElementById('lum-agegate-decline').addEventListener('click', () => {
    el.innerHTML = `
      <div class="lum-agegate__content">
        <span class="lum-eyebrow lum-agegate__eyebrow">Acesso restrito</span>
        <h1 class="lum-agegate__title">Este conteúdo não está disponível pra você</h1>
        <p class="lum-agegate__text">Volte quando tiver 18 anos ou mais.</p>
      </div>
    `;
  });
}


  Object.assign(exports, { isAgeConfirmed, mountAgeGate });
});


__define('components/backup', function(__require, exports) {
/* ============================================================
   components/backup.js
   ------------------------------------------------------------
   Since this ships with zero server (static hosting), "backup"
   means the browser's IndexedDB — which disappears if the user
   clears site data or switches devices. A JSON export/import is
   the honest safety net until cloud sync (if ever) exists.
   ============================================================ */

const { db } = __require('core/db');
const { appState } = __require('core/state');
const { toast } = __require('utils/feedback');
const { icon } = __require('utils/icons');
const ALL_STORES = ['config', 'obras', 'personagens', 'lugares', 'objetos', 'faccoes', 'capitulos', 'resumos', 'cronologia', 'worldbuilding', 'backups'];

function renderBackup(container) {
  appState.set('view', 'backup');
  container.innerHTML = `
    <div class="lum-view">
      <div class="lum-view__header">
        <div>
          <h1 class="lum-view__title">Backup</h1>
          <p class="lum-view__subtitle">Seus dados vivem só neste navegador. Exporte de vez em quando.</p>
        </div>
      </div>
      <div class="lum-panel-grid">
        <div class="lum-card lum-corners">
          <h3 style="font-family:var(--lum-font-heading);font-size:16px;margin-bottom:var(--sp-3);">Exportar tudo</h3>
          <p style="color:var(--lum-cream-dim);font-size:13.5px;line-height:1.7;margin-bottom:var(--sp-4);">Baixa um arquivo .json com todas as obras e tudo vinculado a elas. Guarde num lugar seguro — esse arquivo é a única cópia fora deste navegador.</p>
          <button class="lum-btn lum-btn--primary" id="lum-export-btn">${icon('save', { size: 15 })} Baixar Backup</button>
        </div>
        <div class="lum-card lum-corners">
          <h3 style="font-family:var(--lum-font-heading);font-size:16px;margin-bottom:var(--sp-3);">Restaurar backup</h3>
          <p style="color:var(--lum-cream-dim);font-size:13.5px;line-height:1.7;margin-bottom:var(--sp-4);">Importa um .json exportado daqui. <strong style="color:var(--lum-red-error);">Substitui</strong> os dados atuais deste navegador — não mescla.</p>
          <input type="file" accept="application/json" id="lum-import-input" style="display:none;" />
          <button class="lum-btn lum-btn--ghost" id="lum-import-btn">Escolher arquivo…</button>
        </div>
      </div>
    </div>
  `;

  container.querySelector('#lum-export-btn').addEventListener('click', exportAll);
  const fileInput = container.querySelector('#lum-import-input');
  container.querySelector('#lum-import-btn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importAll(file);
  });
}

async function exportAll() {
  try {
    const dump = {};
    for (const store of ALL_STORES) {
      dump[store] = await db.getAll(store);
    }
    const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), stores: dump }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `luminary-studio-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Backup baixado.');
  } catch (err) {
    toast('Falha ao exportar: ' + err.message, { type: 'error' });
  }
}

async function importAll(file) {
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (!parsed.stores) throw new Error('Arquivo não parece um backup válido.');
    for (const store of ALL_STORES) {
      const records = parsed.stores[store] || [];
      await db.clear(store);
      for (const rec of records) await db.put(store, rec);
    }
    toast('Backup restaurado. Recarregando…');
    setTimeout(() => location.reload(), 1200);
  } catch (err) {
    toast('Falha ao importar: ' + err.message, { type: 'error' });
  }
}


  Object.assign(exports, { renderBackup });
});


__define('components/bibliotecaView', function(__require, exports) {
/* ============================================================

const { bibliotecaService } = __require('services/bibliotecaService');

      <div id="lum-biblio-content"></div>

    tabsEl.innerHTML = tabs.map((t) => `<button type="button" class="lum-preset-chip" data-tab="${t.id}" style="${t.id === currentCategoria ? 'background:var(--lum-gold-bright);color:var(--lum-black-absolute);border-style:solid;' : ''}">${t.label}</button>`).join('');

      btn.addEventListener('click', () => { currentCategoria = btn.dataset.tab; renderTabs(); renderList(); });
    });
  }

  async function renderList() {
    let items = currentQuery ? await bibliotecaService.search(currentQuery) : await bibliotecaService.listAll();
    if (currentCategoria !== 'todas') items = items.filter((i) => i.categoria === currentCategoria);
    items.sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR'));

    if (!items.length) {
      contentEl.innerHTML = `

  const div = document.createElement('div');
  div.textContent = str ?? '';

 * um resumo vazio faria esse capítulo desaparecer silenciosamente da memória dos próximos
 * capítulos (resumosAnteriores exige c.resumo). Isso garante que sempre sobra alguma coisa. */
function buildFallbackResumo(texto) {
  const limpo = (texto || '').trim();
  if (!limpo) return '';
  const trecho = limpo.length > 900 ? `${limpo.slice(0, 900)}…` : limpo;
  return `[Resumo automático de contingência — a IA não retornou um resumo estruturado neste capítulo] ${trecho}`;
}

/* ---------------- INTERACTIVITY ---------------- */

function mountChipField(el, initial, onChange) {
  let chips = [...initial];
  const variant = el.dataset.variant === 'proibido' ? ' lum-chip--proibido' : '';
  function render() {
    const input = el.querySelector('input');
    const value = input ? input.value : '';
    el.innerHTML = chips.map((c) => `<span class="lum-chip${variant}">${esc(c)}<button type="button" data-remove="${esc(c)}">${icon('close', { size: 11 })}</button></span>`).join('') +
      `<input type="text" placeholder="${el.dataset.placeholder || ''}" value="${esc(value)}" ${el.dataset.list ? `list="${el.dataset.list}"` : ''} />`;
    el.querySelector('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        e.preventDefault();
        chips.push(e.target.value.trim());
        onChange(chips);
        render();
        el.querySelector('input').focus();
      } else if (e.key === 'Backspace' && !e.target.value && chips.length) {
        chips.pop();
        onChange(chips);
        render();
      }
    });
    el.querySelectorAll('[data-remove]').forEach((btn) => {
      btn.addEventListener('click', () => {
        chips = chips.filter((c) => c !== btn.dataset.remove);
        onChange(chips);
        render();
      });
    });
  }
  render();
  return { get: () => chips };
}

    chipsObrigatorios: chipsObrigatoriosEl ? mountChipField(chipsObrigatoriosEl, capitulo.eventosObrigatorios || [], () => {}) : null,
    chipsProibidos: chipsProibidosEl ? mountChipField(chipsProibidosEl, capitulo.eventosProibidos || [], () => {}) : null,
    chipsPersonagens: chipsPersonagensEl ? mountChipField(chipsPersonagensEl, capitulo.personagensPresentes || [], () => {}) : null,
  };

        chip.classList.toggle('lum-active');

  ritmoInput?.addEventListener('input', () => {
    wrap.querySelector('#f-ritmo-label').textContent = RITMO_LABELS[ritmoInput.value];
  });
  const intensidadeInput = wrap.querySelector('#f-intensidade');
  intensidadeInput?.addEventListener('input', () => {
    wrap.querySelector('#f-intensidade-label').textContent = `${intensidadeInput.value}/5`;
  });

  wrap.querySelectorAll('[data-preset]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const preset = PRESETS[btn.dataset.preset];
      ritmoInput.value = preset.ritmo;
      wrap.querySelector('#f-ritmo-label').textContent = RITMO_LABELS[preset.ritmo];
      intensidadeInput.value = preset.intensidadeGeral;
      wrap.querySelector('#f-intensidade-label').textContent = `${preset.intensidadeGeral}/5`;
      focos.clear(); preset.focos.forEach((f) => focos.add(f));
      enfases.clear(); preset.enfases.forEach((f) => enfases.add(f));
      tons.clear(); preset.tomEmocional.forEach((f) => tons.add(f));
      wrap.querySelectorAll('#f-focos .lum-multiselect-chip').forEach((chip) => chip.classList.toggle('lum-active', focos.has(chip.dataset.value)));
      wrap.querySelectorAll('#f-enfases .lum-multiselect-chip').forEach((chip) => chip.classList.toggle('lum-active', enfases.has(chip.dataset.value)));
      wrap.querySelectorAll('#f-tons .lum-multiselect-chip').forEach((chip) => chip.classList.toggle('lum-active', tons.has(chip.dataset.value)));
      wrap.querySelector('.lum-disclosure').open = true;
      toast(`Preset "${btn.dataset.preset}" aplicado.`);
    });
  });

  wrap.querySelector('#lum-salvar-padrao')?.addEventListener('click', async () => {
    const padrao = {
      ritmo: Number(ritmoInput.value),
      focos: [...focos],
      enfases: [...enfases],
      tomEmocional: [...tons],
      intensidadeGeral: Number(intensidadeInput.value),
      nivelLiterario: wrap.querySelector('#f-nivel')?.value || 'Intermediário',
    };
    await obraService.update(obraId, { padraoNarrativo: padrao });
    toast('Esse estilo agora é o padrão desta obra — todo capítulo novo já nasce com ele.');
  });
}

function collectFormData(wrap, capitulo) {
  const q = (id) => wrap.querySelector(id)?.value ?? '';
  const has = (id) => !!wrap.querySelector(id);
  const data = {};

  if (has('#f-titulo')) data.titulo = q('#f-titulo');
  if (has('#f-subtitulo')) data.subtitulo = q('#f-subtitulo');
  if (has('#f-pov')) data.pov = q('#f-pov');
  if (has('#f-palavras')) data.palavrasDesejadas = Number(q('#f-palavras')) || 0;
  if (has('#f-pessoa')) data.pessoaNarrativa = q('#f-pessoa');
  if (has('#f-tempo')) data.tempoVerbal = q('#f-tempo');
  if (has('#f-objetivo')) data.objetivo = q('#f-objetivo');
  if (wrap._chips?.chipsObrigatorios) data.eventosObrigatorios = wrap._chips.chipsObrigatorios.get();
  if (wrap._chips?.chipsProibidos) data.eventosProibidos = wrap._chips.chipsProibidos.get();
  if (wrap._chips?.chipsPersonagens) data.personagensPresentes = wrap._chips.chipsPersonagens.get();
  if (has('#f-local')) {
    data.ambientacao = {
      local: q('#f-local'), subLocal: q('#f-sublocal'), horario: q('#f-horario'),
      clima: q('#f-clima'), sensacao: q('#f-sensacao'), detalhes: q('#f-ambdetalhes'),
    };
  }
  if (has('#f-ritmo')) data.ritmo = Number(q('#f-ritmo'));
  if (wrap._multiselect?.focos) data.focos = [...wrap._multiselect.focos];
  if (wrap._multiselect?.enfases) data.enfases = [...wrap._multiselect.enfases];
  if (wrap._multiselect?.tons) data.tomEmocional = [...wrap._multiselect.tons];
  if (has('#f-nivel')) data.nivelLiterario = q('#f-nivel');
  if (has('#f-intensidade')) data.intensidadeGeral = Number(q('#f-intensidade'));
  if (has('#f-regras')) data.regrasEspecificas = q('#f-regras');
  if (has('#f-nota-automatica')) data.notaAutomatica = q('#f-nota-automatica');
  data.modoAutomatico = !!capitulo.modoAutomatico;

  return data;
}

function wireAutosave(wrap, capitulo) {
  const indicator = document.getElementById('lum-autosave-indicator');
  const save = debounce(async () => {
    const data = collectFormData(wrap, capitulo);
    await capituloService.update(capitulo.id, data);
    Object.assign(capitulo, data);
    if (indicator) {
      const prev = indicator.textContent;
      indicator.textContent = 'Rascunho salvo automaticamente';
      setTimeout(() => { if (indicator.textContent === 'Rascunho salvo automaticamente') indicator.textContent = prev; }, 1800);
    }
  }, 600);

  wrap.querySelectorAll('input, textarea, select').forEach((el) => {
    el.addEventListener('input', save);
    el.addEventListener('change', save);
  });
  wrap.querySelectorAll('.lum-multiselect-chip, .lum-chip-input, [data-preset]').forEach((el) => {
    el.addEventListener('click', save);
  });
}

/* ---------------- GENERATION ---------------- */

async function getActiveAIConfig() {
  const active = await aiKeyService.getActive();
  if (!active) return { provider: null, apiKey: null, model: null, keyId: null };
  return { provider: active.fornecedor, apiKey: active.chave, model: active.modelo, keyId: active.id };
}

async function handleForjar(container, obra, capitulo, capituloAnterior, resumosAnteriores) {
  const { provider, apiKey, model, keyId } = await getActiveAIConfig();
  if (!apiKey) {
    toast('Nenhuma chave de API cadastrada. Cadastre uma no Gerenciador de IA antes de forjar.', { type: 'error' });
    router.navigate('/ia');
    return;
  }

  const wrap = container.querySelector('#lum-form-card-wrap');
  const formData = collectFormData(wrap, capitulo);
  await capituloService.update(capitulo.id, formData);
  Object.assign(capitulo, formData);

  const resultArea = container.querySelector('#lum-result-area');
  const btn = container.querySelector('#lum-btn-forjar');
  btn.disabled = true;

  const loader = forgeLoader(resultArea, [
    'Consultando a Bíblia da Obra…',
    'Lendo a memória narrativa…',
    'Conectando os personagens…',
    'Forjando o capítulo…',
    'Polindo a narrativa…',
    'Identificando novos personagens no texto…',
  ]);

  const startedAt = Date.now();
  try {
    const localTexto = (capitulo.ambientacao?.local || '').trim().toLowerCase();
    const lugaresDaObra = await lugarService.listByObra(obra.id);
    const lugarCorrespondente = localTexto
      ? (lugaresDaObra.find((l) => l.nome.trim().toLowerCase() === localTexto) || null)
      : null;

    // Worldbuilding (raças, magia, cultura, política, economia etc.) nunca era
    // lido em lugar nenhum da geração — só "Lugares" tinha algum tratamento, e
    // mesmo assim só o lugar que batesse exatamente com o campo Local daquele
    // capítulo. Agora tanto a lista completa de Lugares quanto todas as
    // entradas de Worldbuilding entram sempre, em todo capítulo (inclusive o
    // primeiro) — são regras do universo, não algo específico de uma cena.
    const worldbuildingDaObra = await worldbuildingService.listByObra(obra.id);

    // Protagonistas SEMPRE entram com a ficha completa (aparência, voz,
    // personalidade etc.), independente de terem sido digitados no campo
    // "Personagens Presentes" deste capítulo — campo que é fácil de esquecer
    // de repetir toda vez, e que nem existe no Modo Automático. Sem isso, só
    // o resumo breve do Elenco Oficial entrava no prompt (nome + função +
    // um trecho de personalidade), sem nenhum dado de aparência — é assim
    // que uma protagonista cadastrada como loira sai castanha na história.
    const personagensCorrespondentes = [];
    const idsJaIncluidos = new Set();
    const protagonistasDaObra = await personagemService.listProtagonistas(obra.id);
    for (const p of protagonistasDaObra) {
      personagensCorrespondentes.push(p);
      idsJaIncluidos.add(p.id);
    }
    for (const nomeChip of capitulo.personagensPresentes || []) {
      const match = await personagemService.findByName(obra.id, nomeChip);
      if (match && !idsJaIncluidos.has(match.id)) {
        personagensCorrespondentes.push(match);
        idsJaIncluidos.add(match.id);
      }
    }
    const elencoCompleto = await personagemService.listByObra(obra.id);

    const { systemPrompt, userPrompt } = buildChapterPrompt({ obra, capitulo, capituloAnterior, resumosAnteriores, lugarCorrespondente, lugaresDaObra, worldbuildingDaObra, personagensCorrespondentes, elencoCompleto });
    const { text } = await aiService.generateText({ provider, apiKey, model, systemPrompt, userPrompt, temperature: 1.0 });
    const elapsed = Date.now() - startedAt;
    await aiKeyService.recordUsage(keyId);
    await aiKeyService.recordResult(keyId, { ok: true });

    const parsed = aiService.parseJsonResponse(text);
    const finalTexto = parsed?.texto || text;
    const finalResumo = parsed?.resumo || buildFallbackResumo(finalTexto);
    const finalTitulo = parsed?.titulo || capitulo.titulo;

    if (!parsed) {
      toast('A IA não respondeu no formato esperado — salvei o texto bruto mesmo assim, nada foi perdido.', { type: 'error' });
    }

    const updated = await capituloService.saveGeneration(capitulo.id, {
      texto: finalTexto, resumo: finalResumo, modeloUtilizado: model || provider, tempoGeracaoMs: elapsed,
    });
    if (finalTitulo && finalTitulo !== capitulo.titulo) {
      await capituloService.update(capitulo.id, { titulo: finalTitulo });
      updated.titulo = finalTitulo;
    }
    Object.assign(capitulo, updated);

    const extracao = await extracaoPersonagensService.extrairESalvar({
      obraId: obra.id, chapterText: finalTexto, provider, apiKey, model,
    });

    loader.stop();
    resultArea.dataset.idiomaAtivo = 'pt';
    renderResult(resultArea, capitulo);
    toast('Capítulo forjado.');
    if (extracao.criados.length) {
      const nomes = extracao.criados.map((c) => c.nome).join(', ');
      toast(`Personagem${extracao.criados.length > 1 ? 's' : ''} detectado${extracao.criados.length > 1 ? 's' : ''} e cadastrado${extracao.criados.length > 1 ? 's' : ''}: ${nomes}. Vale revisar a ficha.`, { duration: 6000 });
    }
  } catch (err) {
    loader.stop();
    if (keyId) await aiKeyService.recordResult(keyId, { ok: false, errorMsg: err.message });
    const friendly = friendlyErrorMessage(err);
    resultArea.innerHTML = `
      <div class="lum-card lum-corners" style="border-color:rgba(178,69,61,0.4);">
        <h3 style="color:var(--lum-red-error);font-family:var(--lum-font-heading);font-size:15px;margin-bottom:var(--sp-2);">Não foi possível gerar</h3>
        <p style="color:var(--lum-cream-dim);font-size:13.5px;">${escapeHtml(friendly)}</p>
        <p style="color:var(--lum-cream-faint);font-size:12px;margin-top:var(--sp-3);">Nada foi perdido — todos os campos que você preencheu já estão salvos. É só tentar de novo.</p>
      </div>
    `;
    toast('Falha ao gerar: ' + friendly, { type: 'error' });
  } finally {
    btn.disabled = false;
    btn.textContent = '';
    btn.innerHTML = `${icon('spark', { size: 16 })} ${capitulo.status === 'gerado' ? 'Forjar Novamente' : 'Forjar Capítulo'}`;
  }
}

/* ---------------- RESULT (PT / EN tabs) ---------------- */

function renderResult(el, capitulo) {
  const idioma = el.dataset.idiomaAtivo || 'pt';
  const temTraducao = !!capitulo.traducaoIngles?.texto;
  const textoAtual = idioma === 'en' ? (capitulo.traducaoIngles?.texto || '') : capitulo.texto;
  const tituloAtual = idioma === 'en' ? (capitulo.traducaoIngles?.tituloIngles || capitulo.titulo) : capitulo.titulo;
  const words = wordCount(textoAtual);
  const tempo = capitulo.tempoGeracaoMs ? `${(capitulo.tempoGeracaoMs / 1000).toFixed(1)}s` : '';

  el.innerHTML = `
    <div class="lum-card lum-corners">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-3);flex-wrap:wrap;gap:8px;">
        <div class="lum-lang-tabs">
          <button type="button" class="lum-lang-tab ${idioma === 'pt' ? 'lum-active' : ''}" data-lang="pt">Português</button>
          <button type="button" class="lum-lang-tab ${idioma === 'en' ? 'lum-active' : ''}" data-lang="en">English${temTraducao ? '' : ' ↗'}</button>
        </div>
        <span style="font-size:11px;color:var(--lum-cream-faint);">${formatNumber(words)} palavras${idioma === 'pt' && tempo ? ` · gerado em ${tempo}` : ''}${idioma === 'pt' && capitulo.modeloUtilizado ? ` · ${escapeHtml(capitulo.modeloUtilizado)}` : ''}</span>
      </div>

      ${idioma === 'en' && !temTraducao ? `
        <div style="text-align:center;padding:var(--sp-7) var(--sp-4);">
          <p style="color:var(--lum-cream-dim);font-size:13px;margin-bottom:var(--sp-4);">Ainda não traduzido para o inglês.</p>
          <button class="lum-btn lum-btn--primary" id="lum-traduzir-btn">${icon('spark', { size: 14 })} Traduzir para Inglês</button>
        </div>
      ` : `
        <h3 style="font-family:var(--lum-font-heading);font-size:16px;margin-bottom:var(--sp-3);">${escapeHtml(tituloAtual || 'Capítulo gerado')}</h3>
        <div class="lum-generated-text" id="lum-texto-editavel" contenteditable="true">${escapeHtml(textoAtual)}</div>
        ${idioma === 'pt' && capitulo.resumo ? `<div class="lum-resumo-box">${escapeHtml(capitulo.resumo)}</div>` : ''}
        <p style="font-size:11px;color:var(--lum-cream-faint);margin-top:var(--sp-3);">Pra mudar só uma parte (uma frase, um parágrafo, um diálogo): selecione o trecho no texto acima e toque em "Reescrever trecho selecionado" — o resto do capítulo continua igual.</p>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:var(--sp-3);flex-wrap:wrap;gap:8px;">
          ${idioma === 'pt' && capitulo.versoes?.length ? `<span class="lum-version-pill" id="lum-ver-versoes">${capitulo.versoes.length} versão(ões) anterior(es) — ver</span>` : '<span></span>'}
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            ${idioma === 'en' ? `<button class="lum-btn lum-btn--ghost" id="lum-retraduzir-btn" style="font-size:12px;padding:6px 12px;">${icon('spark', { size: 12 })} Retraduzir</button>` : ''}
            <button class="lum-btn lum-btn--ghost" id="lum-copiar-texto" style="font-size:12px;padding:6px 12px;">${icon('copy', { size: 13 })} Copiar</button>
            <button class="lum-btn lum-btn--ghost" id="lum-reescrever-trecho" style="font-size:12px;padding:6px 12px;">${icon('spark', { size: 13 })} Reescrever trecho selecionado</button>
            <button class="lum-btn lum-btn--ghost" id="lum-revisar-gramatica" style="font-size:12px;padding:6px 12px;">${icon('spark', { size: 13 })} Revisar gramática</button>
            <button class="lum-btn lum-btn--ghost" id="lum-salvar-edicao">${icon('save', { size: 14 })} Salvar edição</button>
          </div>
        </div>
      `}
    </div>
  `;

  el.querySelectorAll('.lum-lang-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      el.dataset.idiomaAtivo = btn.dataset.lang;
      renderResult(el, capitulo);
    });
  });

  el.querySelector('#lum-traduzir-btn')?.addEventListener('click', () => executarTraducao(el, capitulo, false));
  el.querySelector('#lum-retraduzir-btn')?.addEventListener('click', () => executarTraducao(el, capitulo, true));

  el.querySelector('#lum-salvar-edicao')?.addEventListener('click', async () => {
    const novoTexto = el.querySelector('#lum-texto-editavel').innerText;
    if (idioma === 'en') {
      const traducaoAtualizada = { ...(capitulo.traducaoIngles || {}), texto: novoTexto };
      await capituloService.update(capitulo.id, { traducaoIngles: traducaoAtualizada });
      capitulo.traducaoIngles = traducaoAtualizada;
      toast('Edição salva.');
      renderResult(el, capitulo);
    } else {
      await capituloService.update(capitulo.id, { texto: novoTexto });
      capitulo.texto = novoTexto;
      toast('Edição salva.');
      renderResult(el, capitulo);
      // O resumo salvo ainda descreve a versão ANTERIOR do texto. Se ele não for
      // atualizado, os próximos capítulos são gerados com memória desatualizada em
      // relação ao que ficou escrito de fato — uma causa direta de a IA "perder o fio"
      // da história depois de uma edição manual grande. Atualiza em segundo plano,
      // sem travar o salvamento.
      atualizarResumoAposEdicao(capitulo);
    }
  });

  el.querySelector('#lum-ver-versoes')?.addEventListener('click', () => showVersions(el, capitulo));

  el.querySelector('#lum-copiar-texto')?.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(textoAtual);
      toast('Capítulo copiado, com parágrafos e travessão preservados.');
    } catch {
      toast('Não consegui copiar automaticamente — selecione o texto na tela e copie manualmente.', { type: 'error' });
    }
  });

  el.querySelector('#lum-reescrever-trecho')?.addEventListener('click', () => handleReescreverTrecho(el, capitulo, idioma));
  el.querySelector('#lum-revisar-gramatica')?.addEventListener('click', () => executarRevisaoGramatical(el, capitulo, idioma));
}

/** Passada dedicada de revisão gramatical no capítulo inteiro (concordância,
 * crase, regência, ortografia, pontuação) — sem tocar em enredo ou estilo.
 * Guarda a versão anterior em "versões anteriores" antes de aplicar, pra dar
 * pra desfazer. Não atualiza o resumo: por definição essa revisão não muda
 * fatos da história, só a forma como está escrita. */
async function executarRevisaoGramatical(el, capitulo, idioma) {
  const { provider, apiKey, model } = await getActiveAIConfig();
  if (!apiKey) {
    toast('Configure uma chave de IA antes de revisar.', { type: 'error' });
    return;
  }
  const editavel = el.querySelector('#lum-texto-editavel');
  const textoAtual = editavel ? editavel.textContent : '';
  if (!textoAtual.trim()) {
    toast('Não há texto pra revisar ainda.', { type: 'error' });
    return;
  }

  const loader = forgeLoader(el, ['Revisando concordância, crase e pontuação…', 'Sem mudar o que a história conta — só a forma como está escrita…']);
  try {
    const userPrompt = buildRevisaoGramaticalPrompt({ texto: textoAtual, idioma });
    const { text } = await aiService.generateText({ provider, apiKey, model, userPrompt, temperature: 0.2 });
    const textoRevisado = text.trim();

    if (idioma === 'en') {
      const traducaoAtualizada = { ...(capitulo.traducaoIngles || {}), texto: textoRevisado };
      await capituloService.update(capitulo.id, { traducaoIngles: traducaoAtualizada });
      capitulo.traducaoIngles = traducaoAtualizada;
    } else {
      const versoes = [...(capitulo.versoes || []), { texto: capitulo.texto, resumo: capitulo.resumo, salvoEm: new Date().toISOString() }];
      await capituloService.update(capitulo.id, { texto: textoRevisado, versoes });
      capitulo.texto = textoRevisado;
      capitulo.versoes = versoes;
    }

    loader.stop();
    toast('Revisão gramatical aplicada.');
    renderResult(el, capitulo);
  } catch (err) {
    loader.stop();
    toast('Falha ao revisar: ' + friendlyErrorMessage(err), { type: 'error' });
    renderResult(el, capitulo);
  }
}

/** Lê a seleção de texto atual dentro do container e devolve o início/fim em
 * índice de caractere (mesma indexação de capitulo.texto, já que o conteúdo
 * é texto puro sem tags aninhadas) junto com o texto selecionado. Devolve
 * null se não houver seleção válida dentro do container. */
function getSelectionOffsets(container) {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0) return null;
  const range = selection.getRangeAt(0);
  if (!container.contains(range.commonAncestorContainer)) return null;
  const selectedText = range.toString();
  if (!selectedText.trim()) return null;
  const preRange = document.createRange();
  preRange.selectNodeContents(container);
  preRange.setEnd(range.startContainer, range.startOffset);
  const start = preRange.toString().length;
  return { start, end: start + selectedText.length, selectedText };
}

function handleReescreverTrecho(el, capitulo, idioma) {
  const editavel = el.querySelector('#lum-texto-editavel');
  const sel = editavel ? getSelectionOffsets(editavel) : null;
  if (!sel) {
    toast('Selecione (toque e arraste) o trecho que você quer reescrever antes de tocar aqui.', { type: 'error' });
    return;
  }

  openModal({
    title: 'Reescrever trecho selecionado',
    bodyHtml: `
      <div class="lum-resumo-box" style="margin:0 0 var(--sp-4);">${escapeHtml(sel.selectedText.length > 300 ? sel.selectedText.slice(0, 300) + '…' : sel.selectedText)}</div>
      <div class="lum-field"><label>O que você quer mudar nesse trecho? (opcional)</label><textarea id="rt-instrucao" rows="3" placeholder="Ex: deixa mais tenso / troca essas palavras / conserta a pontuação do diálogo"></textarea></div>
      <p style="font-size:11px;color:var(--lum-cream-faint);">Só esse trecho muda. O resto do capítulo continua exatamente como está.</p>
    `,
    footerHtml: `
      <button class="lum-btn lum-btn--ghost" data-cancel>Cancelar</button>
      <button class="lum-btn lum-btn--primary" data-confirmar>${icon('spark', { size: 13 })} Reescrever</button>
    `,
    onMount: (overlay, close) => {
      overlay.querySelector('[data-cancel]').addEventListener('click', close);
      overlay.querySelector('[data-confirmar]').addEventListener('click', async () => {
        const instrucao = overlay.querySelector('#rt-instrucao').value.trim();
        close();
        await executarReescritaTrecho(el, capitulo, idioma, sel, instrucao);
      });
    },
  });
}

async function executarReescritaTrecho(el, capitulo, idioma, sel, instrucao) {
  const { provider, apiKey, model } = await getActiveAIConfig();
  if (!apiKey) {
    toast('Configure uma chave de IA antes de reescrever um trecho.', { type: 'error' });
    return;
  }

  // Lê o texto direto da tela (não capitulo.texto em memória) — assim, se ela
  // tiver digitado alguma edição manual antes de selecionar o trecho, sem ter
  // clicado em "Salvar edição" ainda, nada se perde: a reescrita entra em
  // cima do que está realmente na tela.
  const editavelAntes = el.querySelector('#lum-texto-editavel');
  const textoCompleto = editavelAntes.textContent;
  const contextoAntes = textoCompleto.slice(Math.max(0, sel.start - 400), sel.start);
  const contextoDepois = textoCompleto.slice(sel.end, sel.end + 400);

  const loader = forgeLoader(el, ['Reescrevendo o trecho…', 'Ajustando pra encaixar no resto do capítulo…']);
  try {
    const obra = appState.get('obraAtiva');

      await capituloService.update(capitulo.id, { traducaoIngles: traducaoAtualizada });

      // pra desfazer pela mesma tela de "versões anteriores" que já existe.
      const versoes = [...(capitulo.versoes || []), { texto: capitulo.texto, resumo: capitulo.resumo, salvoEm: new Date().toISOString() }];

      // Mesmo cuidado da edição manual: o resumo usado como memória dos

      atualizarResumoAposEdicao(capitulo);

/* ============================================================
   core/router.js — hash router
   ------------------------------------------------------------
   Static-site friendly: '#/gaveta', '#/dashboard/:id', etc.
   work with zero server config on GitHub Pages / Cloudflare
   Pages, unlike history-API routing which needs a rewrite rule.
   ============================================================ */

const routes = new Map(); // pattern -> handler(params)

function register(pattern, handler) {
  routes.set(pattern, handler);
}

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, query] = raw.split('?');
  const segments = path.split('/').filter(Boolean);
  return { segments, query: new URLSearchParams(query || '') };
}

function matchRoute(segments) {
  for (const [pattern, handler] of routes) {
    const patternSegments = pattern.split('/').filter(Boolean);
    if (patternSegments.length !== segments.length) continue;
    const params = {};
    let matched = true;
    for (let i = 0; i < patternSegments.length; i++) {
      const p = patternSegments[i];
      if (p.startsWith(':')) {
        params[p.slice(1)] = segments[i];
      } else if (p !== segments[i]) {
        matched = false;
        break;
      }
    }
    if (matched) return { handler, params };
  }
  return null;
}

function resolve() {
  const { segments, query } = parseHash();
  const match = matchRoute(segments.length ? segments : ['gaveta']);
  if (match) {
    match.handler({ ...match.params, query });
  } else {
    routes.get('gaveta')?.({});
  }
}

function navigate(path) {
  location.hash = path.startsWith('/') ? path : `/${path}`;
}

function start() {
  window.addEventListener('hashchange', resolve);
  resolve();
}

const router = { register, navigate, start };


  Object.assign(exports, { router });
});

/* ============================================================
   core/state.js — minimal pub/sub app state
   ------------------------------------------------------------
   Deliberately not a framework. At this scope (shell + obra
   CRUD) a ~40-line observable is enough and keeps the bundle
   dependency-free, which matters since this ships as static
   files with no build step.
   ============================================================ */

  obraAtiva: null,       // full obra object, or null when on the library/dashboard shell
  sidebarCollapsed: false,
  sidebarDrawerOpen: false, // mobile only
  view: 'gaveta',          // current route id
};

  return state[key];
}

  state[key] = value;
  const set_ = listeners.get(key);
  if (set_) set_.forEach((fn) => fn(value));

  if (!listeners.has(key)) listeners.set(key, new Set());

    return all.find((k) => k.ativa) || all[0] || null;

      modelo: modelo?.trim() || '',
      chave: chave.trim(),

/* ============================================================

function uid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;

  });
}

function debounce(fn, wait = 250) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), wait);
  };
}

function formatNumber(n) {
  return new Intl.NumberFormat('pt-BR').format(n || 0);
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }).format(d);
}

function formatRelative(iso) {
  if (!iso) return '—';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'agora mesmo';
  if (mins < 60) return `há ${mins} min`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `há ${hours}h`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `há ${days}d`;
  return formatDate(iso);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function wordCount(text) {
  if (!text) return 0;
  return text.trim().split(/\s+/).filter(Boolean).length;
}
